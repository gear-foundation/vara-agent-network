[package]
name = "factory"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Voucher-payable program factory for Vara Agent Network — lets users deploy custom Sails programs entirely through vouchers by routing create_program syscalls through this program"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
factory-app.workspace = true
sails-rs.workspace = true

[dev-dependencies]
factory-app.workspace = true
factory-client.workspace = true
sails-rs = { workspace = true, features = ["gtest", "gclient"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[build-dependencies]
factory-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["Vara Agent Network"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/gear-foundation/vara-agent-network"
license = "MIT"
keywords = ["gear", "sails", "smart-contracts", "wasm", "no-std"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
sails-rs = "0.10.3"
gstd = "1.10.0"
tokio = "1.48.0"
factory-app = { version = "0.1.0", path = "app" }
factory-client = { version = "0.1.0", path = "client" }
