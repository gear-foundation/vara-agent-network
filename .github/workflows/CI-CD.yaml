name: Build and Deploy Vara Agent Network

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Target environment
        required: false
        options: [prod]
      deploy_indexer:
        type: boolean
        description: Build indexer
        default: true
      deploy_seed:
        type: boolean
        description: Build seed
        default: true
      deploy_voucher:
        type: boolean
        description: Build voucher
        default: true
      deploy_frontend:
        type: boolean
        description: Build frontend
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write
  id-token: write

jobs:
  deploy:
    uses: gear-ops/actions/.github/workflows/build-deploy.yaml@main
    with:
      app: vara-agent-network
      env: ${{ inputs.env }}
      components: |
        - name: indexer
          docker_file: services/indexer/Dockerfile
          chart_init_containers: migrations
          chart_components_extra: explorer
          paths: |
            services/indexer/**
            programs/**
        - name: seed
          docker_context: services/seed-backend
          chart_init_containers: migrations
          paths: services/seed-backend/**
        - name: voucher
          docker_context: services/voucher-backend
          chart_init_containers: migrations
          paths: services/voucher-backend/**
        - name: frontend
          docker_context: frontend
          paths: frontend/**
    secrets:
      CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
